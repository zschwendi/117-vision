name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    # The host-backed C fixtures use Mach APIs and Apple's linker even in the
    # subset that skips the GPU/visionOS checks. Use the supported host OS.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/check_repository_hygiene.py --strict
      - run: python3 tools/run_source_checks.py --portable-only
      - run: python3 tools/run_source_checks.py --portable-only --sanitize
      # These source fixtures need Darwin frameworks/linker, but no iPad,
      # simulator, game payload or signing. Metal reports SKIP without a GPU.
      # Portable prompt/routing C checks run above. The device-SDK routing
      # probe only compiles, so run it once; missing SDKs explicitly SKIP.
      # Spatial controller-name metadata needs macOS/SDK26 and explicitly
      # skips on this macOS15 runner; other prompt checks still execute.
      - name: Input and graphics source fixtures
        run: >-
          python3 -B tools/run_source_checks.py
          --only device-input,device_messages,pad-input-policy,pad-input-session,guest_page_try,d3d9_transaction,d3d9_admission,mobile-graphics-runtime,mobile-graphics-metal,launch-preferences,frame-limit-sdk-routing,input-prompt-device,controller-prompt-names,library-artwork
      - name: Input and graphics sanitizers
        run: >-
          python3 -B tools/run_source_checks.py --sanitize
          --only device-input,device_messages,pad-input-policy,pad-input-session,guest_page_try,d3d9_transaction,d3d9_admission,mobile-graphics-runtime,mobile-graphics-metal,launch-preferences,input-prompt-device,controller-prompt-names,library-artwork
