name: EnginePad
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    COMPILER_INDEX_STORE_ENABLE: NO
  configs:
    Release:
      GCC_OPTIMIZATION_LEVEL: "2"
targets:
  EnginePad:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: ../EngineVision/Resources/ThirdPartyNotices.txt
        buildPhase: resources
      - path: ../EngineVision/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../EngineVision/Sources/EngineAssets.swift
      - path: ../EngineVision/Sources/EngineFrameView.swift
      - path: ../EngineVision/Sources/EngineFrameTexture.swift
      - path: ../EngineVision/Sources/EngineLibraryStyle.swift
      - path: ../EngineVision/Sources/EngineHaptics.swift
      - path: ../EngineVision/Sources/EngineAboutView.swift
      - path: ../EngineVision/Sources/EngineGraphicsModsView.swift
      - path: ../EngineVision/Sources/EngineSaveArchive.swift
      - path: ../EngineVision/Sources/EngineCloudSaves.swift
      - path: ../EngineVision/Sources/EngineCloudSavesView.swift
      - path: ../EngineVision/Sources/EngineVisionRuntime.m
      - path: ../EngineHost/host.c
      - path: ../EngineHost/shims_kernel32.c
      - path: ../EngineHost/shims_misc.c
      - path: ../EngineHost/winsock.c
      - path: ../EngineHost/directsound.c
      - path: ../EngineHost/directsound_mixer.c
      - path: ../EngineHost/vorbis_shim.c
      - path: ../EngineHost/d3d9.c
      - path: ../EngineHost/texture_decode.c
      - path: ../EngineHost/metalshader.c
      - path: ../EngineHost/dinput8.c
      - path: ../EngineHost/ddraw.c
      - path: ../EngineHost/resources.c
      - path: ../EngineHost/overrides.c
      - path: ../EngineHost/threading.c
      - path: ../EngineHost/pointer.c
      - path: ../EngineHost/haptics.c
      - path: ../EngineHost/halo_settings.c
      - path: ../EngineHost/gamecontroller.m
      - path: ../EngineHost/metalrenderer.m
      - path: ../../third_party/mojoshader/mojoshader.c
      - path: ../../third_party/mojoshader/mojoshader_common.c
      - path: ../../third_party/mojoshader/profiles/mojoshader_profile_common.c
      - path: ../../third_party/mojoshader/profiles/mojoshader_profile_metal.c
      - path: ../build/engine-reuse/whole-exe
        includes:
          - "chunk_*.c"
          - engine_bundle.c
          - engine_imports.c
      - path: ../../.setup/GamePayload
        type: folder
        buildPhase: resources
      - path: ../../.setup/GamePayloadManifest.json
        buildPhase: resources
      - path: ../../.setup/VisualMods/TextureMods.hvt
        buildPhase: resources
      - path: ../../.setup/VisualMods/ShaderMods.hvs
        buildPhase: resources
      - path: ../../.setup/VisualMods/CEnshineSources.zip
        buildPhase: resources
      - path: ../../.setup/VisualMods/VisualModsManifest.json
        buildPhase: resources
    dependencies:
      - sdk: Foundation.framework
      - sdk: SwiftUI.framework
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: MetalFX.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zephyrstudios.mastercheef.ipad
        PRODUCT_NAME: MasterCheef
        PRODUCT_MODULE_NAME: MasterCheefPad
        CODE_SIGN_ENTITLEMENTS: EnginePad.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "117"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "123"
        MARKETING_VERSION: "1.0.23"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/EnginePad-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources $(SRCROOT)/../EngineVision/Sources $(SRCROOT)/../../third_party/mojoshader $(SRCROOT)/../EngineHost $(SRCROOT)/../EngineReuse $(SRCROOT)/../build/engine-reuse/whole-exe"
        OTHER_CFLAGS: "$(inherited) -frounding-math -ffp-contract=off -DENGINE_FLAT_MEMORY=1 -DHALO_ARM64_FENV_FAST=1 -DMOJOSHADER_NO_VERSION_INCLUDE=1 -DSUPPORT_PROFILE_D3D=0 -DSUPPORT_PROFILE_BYTECODE=0 -DSUPPORT_PROFILE_HLSL=0 -DSUPPORT_PROFILE_GLSL120=0 -DSUPPORT_PROFILE_GLSLES=0 -DSUPPORT_PROFILE_GLSLES3=0 -DSUPPORT_PROFILE_GLSL=0 -DSUPPORT_PROFILE_ARB1=0 -DSUPPORT_PROFILE_ARB1_NV=0 -DSUPPORT_PROFILE_SPIRV=0 -DSUPPORT_PROFILE_GLSPIRV=0"
        OTHER_LDFLAGS: "$(inherited) -lm"
